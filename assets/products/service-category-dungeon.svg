<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a"/>
      <stop offset="50%" stop-color="#2a0812"/>
      <stop offset="100%" stop-color="#090306"/>
    </linearGradient>
    <radialGradient id="dgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#b71c1c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#dgGlow)"/>

  <!-- Dungeon Gate & Crossed Swords -->
  <circle cx="250" cy="170" r="75" fill="none" stroke="#ff1744" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- Crossed Swords -->
  <line x1="190" y1="110" x2="310" y2="230" stroke="#ffebee" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="310" y1="110" x2="190" y2="230" stroke="#ffebee" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="250,130 265,170 250,210 235,170" fill="#ff1744"/>

  <!-- Badges -->
  <rect x="25" y="24" width="168" height="26" rx="13" fill="#ff1744" fill-opacity="0.2" stroke="#ff1744" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#ff1744"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#ff8a80">เควสดันเจียนรายสัปดาห์</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#0e0407" fill-opacity="0.94" stroke="#ff1744" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">เควสดันเจียนรายสัปดาห์</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#ff8a80" text-anchor="middle">บริการลงดันบอสประจำสัปดาห์ การันตีจบเควสทุกรอบ</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#ff1744" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>