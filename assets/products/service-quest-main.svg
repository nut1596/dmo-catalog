<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191307"/>
      <stop offset="50%" stop-color="#30240e"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <radialGradient id="storyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#storyGlow)"/>

  <!-- Quest Scroll & World Map Compass Motif -->
  <rect x="180" y="90" width="140" height="150" rx="8" fill="#201708" stroke="#eab308" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="205" y1="120" x2="295" y2="120" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="145" x2="295" y2="145" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="170" x2="270" y2="170" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="195" x2="295" y2="195" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass Star on top of map -->
  <polygon points="250,70 256,90 275,95 256,100 250,120 244,100 225,95 244,90" fill="#fef9c3" filter="url(#glow)"/>

  <!-- Waypoints & Quest Flags -->
  <circle cx="130" cy="165" r="8" fill="#eab308" filter="url(#glow)"/>
  <circle cx="370" cy="165" r="8" fill="#eab308" filter="url(#glow)"/>
  <line x1="138" y1="165" x2="180" y2="165" stroke="#eab308" stroke-dasharray="4,4" stroke-width="2"/>
  <line x1="320" y1="165" x2="362" y2="165" stroke="#eab308" stroke-dasharray="4,4" stroke-width="2"/>

  <!-- Badges -->
  <rect x="25" y="24" width="110" height="26" rx="13" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#eab308"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#fef08a">รับทำเควส</text>

  <rect x="345" y="24" width="130" height="26" rx="6" fill="#201708" stroke="#eab308" stroke-width="1"/>
  <text x="410" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#eab308" text-anchor="middle">🗺️ เนื้อเรื่องทุกแมพ</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#0a0802" fill-opacity="0.94" stroke="#eab308" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">เควสหลัก (เนื้อเรื่องทุกแมพ)</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#fef08a" text-anchor="middle">รับวิ่งเควสหลัก ปลดแมพตามเนื้อเรื่องการันตีรวดเร็ว · 75 ฿/แมพ</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#eab308" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>