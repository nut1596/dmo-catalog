<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b1c"/>
      <stop offset="50%" stop-color="#3b1137"/>
      <stop offset="100%" stop-color="#0e040d"/>
    </linearGradient>
    <radialGradient id="evoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#evoGlow)"/>

  <!-- Transcendent Evolution Crest Motif -->
  <circle cx="250" cy="170" r="75" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
  <!-- Burst Mode Wings -->
  <path d="M250,170 C210,100 130,80 80,110 C100,150 140,170 180,180 C140,200 110,230 100,260 C150,240 200,215 250,195 Z" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
  <path d="M250,170 C290,100 370,80 420,110 C400,150 360,170 320,180 C360,200 390,230 400,260 C350,240 300,215 250,195 Z" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>

  <!-- Evolution Diamond Star -->
  <polygon points="250,105 268,155 315,170 268,185 250,235 232,185 185,170 232,155" fill="#fdf2f8" filter="url(#glow)"/>
  <circle cx="250" cy="170" r="12" fill="#ec4899"/>

  <!-- Badges -->
  <rect x="25" y="24" width="110" height="26" rx="13" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#ec4899"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">รับทำเควส</text>

  <rect x="335" y="24" width="140" height="26" rx="6" fill="#240722" stroke="#ec4899" stroke-width="1"/>
  <text x="405" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#ec4899" text-anchor="middle">✨ รองรับทุกเควสปลด</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#0e040d" fill-opacity="0.94" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">เควสปลดร่าง / อื่น ๆ</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#fbcfe8" text-anchor="middle">ปลดเบิร์สโหมด / จ็อกเกรส / ไซด์เควสทุกประเภท · สอบถามราคา</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>