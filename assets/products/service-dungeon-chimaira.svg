<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="50%" stop-color="#14263b"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0066cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#auraGlow)"/>

  <!-- Cyber Grid -->
  <g stroke="#00d2ff" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="280" x2="500" y2="280"/>
    <line x1="0" y1="320" x2="500" y2="320"/>
    <line x1="0" y1="360" x2="500" y2="360"/>
    <line x1="250" y1="240" x2="80" y2="400"/>
    <line x1="250" y1="240" x2="180" y2="400"/>
    <line x1="250" y1="240" x2="250" y2="400"/>
    <line x1="250" y1="240" x2="320" y2="400"/>
    <line x1="250" y1="240" x2="420" y2="400"/>
  </g>

  <!-- Genetic Fusion Crest / Chimairamon Emblem -->
  <circle cx="250" cy="170" r="80" fill="none" stroke="#00d2ff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8,5"/>
  <circle cx="250" cy="170" r="55" fill="#081829" stroke="#00d2ff" stroke-width="2" filter="url(#glow)"/>

  <!-- Beast Claws & Wings Motif -->
  <path d="M210,135 Q180,110 140,130 Q170,160 210,165 Z" fill="#00e5ff" opacity="0.8"/>
  <path d="M290,135 Q320,110 360,130 Q330,160 290,165 Z" fill="#00e5ff" opacity="0.8"/>
  <path d="M250,120 L265,160 L285,150 L260,180 L275,210 L250,195 L225,210 L240,180 L215,150 L235,160 Z" fill="#ffffff" filter="url(#glow)"/>

  <!-- Badges -->
  <rect x="25" y="24" width="168" height="26" rx="13" fill="#00d2ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#00e5ff"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#80d8ff">เควสดันเจียนรายสัปดาห์</text>

  <rect x="365" y="24" width="110" height="26" rx="6" fill="#081829" stroke="#00e5ff" stroke-width="1"/>
  <text x="420" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#00e5ff" text-anchor="middle">3 รอบ จบเควส</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#06121f" fill-opacity="0.9" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">คิเมรามอน (ระดับง่าย)</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#80d8ff" text-anchor="middle">ลงครบ 3 รอบ เคลียร์เควส 100% · 55 ฿</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#00d2ff" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>