<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051912"/>
      <stop offset="50%" stop-color="#0a3324"/>
      <stop offset="100%" stop-color="#020d09"/>
    </linearGradient>
    <radialGradient id="expGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#expGlow)"/>

  <!-- Level 150 -> 160 Badge Display -->
  <g filter="url(#glow)">
    <rect x="110" y="115" width="115" height="70" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="167" y="145" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle">LEVEL</text>
    <text x="167" y="174" font-family="'Kanit', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">150</text>

    <!-- Arrow -->
    <polygon points="245,150 255,140 255,146 270,146 270,154 255,154 255,160" fill="#34d399"/>

    <rect x="275" y="115" width="115" height="70" rx="12" fill="#047857" stroke="#34d399" stroke-width="2.5"/>
    <text x="332" y="145" font-family="'Kanit', sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle">MAX LEVEL</text>
    <text x="332" y="174" font-family="'Kanit', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">160</text>
  </g>

  <!-- EXP Lightning Surge & Progress Bar -->
  <rect x="110" y="210" width="280" height="14" rx="7" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
  <rect x="112" y="212" width="250" height="10" rx="5" fill="#10b981" filter="url(#glow)"/>
  <text x="250" y="244" font-family="'Kanit', sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">EXP BOOST + 100% SUCCESS</text>

  <!-- Badges -->
  <rect x="25" y="24" width="100" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#10b981"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">รับเวล</text>

  <rect x="350" y="24" width="125" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="412" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">⚡ ปั่นเวลไว ปลอดภัย</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#020d09" fill-opacity="0.94" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">รับเวล จาก 150-160</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#a7f3d0" text-anchor="middle">เร่งเลเวลไว ปลอดภัย 100% ตัวละครตันพร้อมลุย · 80 ฿/เวล</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>