<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#sparkGlow)"/>

  <!-- Metal Gear / Cog Motif -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" filter="url(#glow)">
    <circle cx="250" cy="170" r="60"/>
    <circle cx="250" cy="170" r="30" fill="#111827"/>
  </g>
  <!-- Gear Teeth -->
  <g fill="#f59e0b" opacity="0.85">
    <rect x="242" y="98" width="16" height="20" rx="3"/>
    <rect x="242" y="222" width="16" height="20" rx="3"/>
    <rect x="178" y="162" width="20" height="16" rx="3"/>
    <rect x="302" y="162" width="20" height="16" rx="3"/>
    <rect x="195" y="115" width="16" height="18" rx="3" transform="rotate(45 203 124)"/>
    <rect x="289" y="209" width="16" height="18" rx="3" transform="rotate(45 297 218)"/>
    <rect x="289" y="115" width="16" height="18" rx="3" transform="rotate(-45 297 124)"/>
    <rect x="195" y="209" width="16" height="18" rx="3" transform="rotate(-45 203 218)"/>
  </g>
  <!-- Metal Lightning Spark -->
  <polygon points="255,140 240,170 252,170 245,200 262,165 250,165" fill="#fef3c7" filter="url(#glow)"/>

  <!-- Badges -->
  <rect x="25" y="24" width="168" height="26" rx="13" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#f59e0b"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#fde68a">เควสดันเจียนรายสัปดาห์</text>

  <rect x="365" y="24" width="110" height="26" rx="6" fill="#1f2937" stroke="#f59e0b" stroke-width="1"/>
  <text x="420" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">⚙️ 5 รอบ จบเควส</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#030712" fill-opacity="0.94" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">เมทัล 5 รอบ จบเควส</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#fde68a" text-anchor="middle">ดันเจียนเมทัล 5 รอบ เคลียร์จบครบทีมการันตี · 100 ฿</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>