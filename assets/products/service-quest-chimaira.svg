<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#0f344a"/>
      <stop offset="100%" stop-color="#030d13"/>
    </linearGradient>
    <radialGradient id="runeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#runeGlow)"/>

  <!-- Ancient Speed Runestone Motif -->
  <polygon points="250,85 320,125 320,215 250,255 180,215 180,125" fill="#0c2333" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="250,105 300,135 300,205 250,235 200,205 200,135" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Speed Wing / Motion Trail -->
  <path d="M225,180 L275,135 L260,170 L285,170 L235,215 L250,180 Z" fill="#e0f2fe" filter="url(#glow)"/>
  <!-- Orbiting Rune Sparks -->
  <circle cx="160" cy="170" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="340" cy="170" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="250" cy="65" r="4" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Badges -->
  <rect x="25" y="24" width="110" height="26" rx="13" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#38bdf8"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#bae6fd">รับทำเควส</text>

  <rect x="330" y="24" width="145" height="26" rx="6" fill="#092131" stroke="#38bdf8" stroke-width="1"/>
  <text x="402" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">💎 4 รอบ · หาหินวิ่ง</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#030d13" fill-opacity="0.94" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">เควสคิเมรามอน (หาหินวิ่ง)</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#bae6fd" text-anchor="middle">พาลงคิเมราทั่วไป 4 รอบ เคลียร์เควสหาหินวิ่ง · 1 ฿/4รอบ</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>