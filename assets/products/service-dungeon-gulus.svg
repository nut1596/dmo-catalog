<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a"/>
      <stop offset="50%" stop-color="#2a0812"/>
      <stop offset="100%" stop-color="#090306"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ff2a4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ff1744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#990012"/>
      <stop offset="40%" stop-color="#ff1744"/>
      <stop offset="80%" stop-color="#ff7543"/>
      <stop offset="100%" stop-color="#ffebee"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#flameGlow)"/>

  <!-- Cyber Grid Floor -->
  <g stroke="#ff1744" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="280" x2="500" y2="280"/>
    <line x1="0" y1="315" x2="500" y2="315"/>
    <line x1="0" y1="355" x2="500" y2="355"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="250" y1="250" x2="50" y2="400"/>
    <line x1="250" y1="250" x2="150" y2="400"/>
    <line x1="250" y1="250" x2="250" y2="400"/>
    <line x1="250" y1="250" x2="350" y2="400"/>
    <line x1="250" y1="250" x2="450" y2="400"/>
  </g>

  <!-- Cyber Pillars / Pillars of Darkness -->
  <rect x="25" y="80" width="30" height="200" rx="4" fill="#1b080f" stroke="#ff1744" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="445" y="80" width="30" height="200" rx="4" fill="#1b080f" stroke="#ff1744" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="40" y1="100" x2="40" y2="260" stroke="#ff1744" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="460" y1="100" x2="460" y2="260" stroke="#ff1744" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Dungeon Seal Crest (Center) -->
  <circle cx="250" cy="180" r="85" fill="none" stroke="#ff1744" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="250,110 310,215 190,215" fill="none" stroke="#ff5252" stroke-opacity="0.4" stroke-width="2"/>
  <polygon points="250,250 310,145 190,145" fill="none" stroke="#ff5252" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Dark Dragon Horn & Flames (GulusGammamon Motif) -->
  <path d="M250,90 Q258,135 240,165 Q250,150 258,125 Q262,105 250,90 Z" fill="#ffebee" filter="url(#glow)"/>
  <!-- Winged Silhouette / Dragon Wings -->
  <path d="M250,185 C220,130 140,120 100,160 C120,180 150,195 190,190 C150,205 125,230 115,250 C160,240 210,225 250,210 Z" fill="url(#fireGrad)" opacity="0.85"/>
  <path d="M250,185 C280,130 360,120 400,160 C380,180 350,195 310,190 C350,205 375,230 385,250 C340,240 290,225 250,210 Z" fill="url(#fireGrad)" opacity="0.85"/>
  <!-- Dark Dragon Core -->
  <circle cx="250" cy="195" r="30" fill="#0d0205" stroke="#ff1744" stroke-width="3" filter="url(#glow)"/>
  <polygon points="250,175 262,195 250,215 238,195" fill="#ff1744"/>

  <!-- Category Tag -->
  <rect x="25" y="24" width="168" height="26" rx="13" fill="#ff1744" fill-opacity="0.2" stroke="#ff1744" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#ff1744"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#ff8a80" letter-spacing="0.5">เควสดันเจียนรายสัปดาห์</text>

  <!-- Mode Badge -->
  <rect x="375" y="24" width="100" height="26" rx="6" fill="#1b080f" stroke="#ff5252" stroke-width="1"/>
  <text x="425" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#ff5252" text-anchor="middle">รอบล่ะ 40 ฿</text>

  <!-- Big Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#0e0407" fill-opacity="0.9" stroke="#ff1744" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">กุลุสแกมมามอน</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#ff8a80" text-anchor="middle">ดันเจียนระดับทั่วไป · พร้อมตี้ลงจบไว</text>

  <!-- Frame Border -->
  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#ff1744" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>