<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e24"/>
      <stop offset="50%" stop-color="#2e1548"/>
      <stop offset="100%" stop-color="#0e0617"/>
    </linearGradient>
    <radialGradient id="divineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#9c27b0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#divineGlow)"/>

  <!-- Holy Golden Rays -->
  <g stroke="#ffd700" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="250" y1="170" x2="50" y2="30"/>
    <line x1="250" y1="170" x2="150" y2="10"/>
    <line x1="250" y1="170" x2="350" y2="10"/>
    <line x1="250" y1="170" x2="450" y2="30"/>
    <line x1="250" y1="170" x2="50" y2="380"/>
    <line x1="250" y1="170" x2="450" y2="380"/>
  </g>

  <!-- Cyber Grid -->
  <g stroke="#ba68c8" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="280" x2="500" y2="280"/>
    <line x1="0" y1="320" x2="500" y2="320"/>
    <line x1="0" y1="360" x2="500" y2="360"/>
    <line x1="250" y1="240" x2="100" y2="400"/>
    <line x1="250" y1="240" x2="200" y2="400"/>
    <line x1="250" y1="240" x2="250" y2="400"/>
    <line x1="250" y1="240" x2="300" y2="400"/>
    <line x1="250" y1="240" x2="400" y2="400"/>
  </g>

  <!-- Divine Sword / Orochi Wings Motif -->
  <circle cx="250" cy="170" r="75" fill="none" stroke="#ffd700" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Central Great Sword of Light -->
  <polygon points="250,75 258,160 250,230 242,160" fill="#fff9c4" filter="url(#glow)"/>
  <polygon points="250,90 264,165 250,220 236,165" fill="#ffd700" opacity="0.8"/>
  <!-- Wings of Susanoo -->
  <path d="M250,150 Q180,110 120,130 Q170,180 230,175 Z" fill="#ab47bc" opacity="0.85"/>
  <path d="M250,150 Q320,110 380,130 Q330,180 270,175 Z" fill="#ab47bc" opacity="0.85"/>
  <circle cx="250" cy="170" r="22" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="250" cy="170" r="14" fill="#240c38"/>

  <!-- Badges -->
  <rect x="25" y="24" width="168" height="26" rx="13" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#ffd700"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#ffe082">เควสดันเจียนรายสัปดาห์</text>

  <rect x="365" y="24" width="110" height="26" rx="6" fill="#200d36" stroke="#ffd700" stroke-width="1"/>
  <text x="420" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#ffd700" text-anchor="middle">⚡ 5 รอบ จบเควส</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#12061e" fill-opacity="0.94" stroke="#ffd700" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">ซูซา 5 รอบ จบเควส</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#ffe082" text-anchor="middle">ดันเจียนซูซาโนโอมอน ครบ 5 รอบ ปลดเควส 100% · 60 ฿</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#ffd700" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>