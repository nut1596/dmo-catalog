<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a0a"/>
      <stop offset="50%" stop-color="#33140e"/>
      <stop offset="100%" stop-color="#0a0303"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d00" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#dd2c00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>
  <rect width="500" height="400" fill="url(#auraGlow)"/>

  <!-- Cyber Grid -->
  <g stroke="#ff3d00" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="280" x2="500" y2="280"/>
    <line x1="0" y1="320" x2="500" y2="320"/>
    <line x1="0" y1="360" x2="500" y2="360"/>
    <line x1="250" y1="240" x2="80" y2="400"/>
    <line x1="250" y1="240" x2="180" y2="400"/>
    <line x1="250" y1="240" x2="250" y2="400"/>
    <line x1="250" y1="240" x2="320" y2="400"/>
    <line x1="250" y1="240" x2="420" y2="400"/>
  </g>

  <!-- Hard Mode Crest -->
  <circle cx="250" cy="170" r="80" fill="none" stroke="#ff3d00" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8,5"/>
  <circle cx="250" cy="170" r="55" fill="#1f0a05" stroke="#ff3d00" stroke-width="2" filter="url(#glow)"/>

  <!-- Aggressive Beast Silhouette & Hard Mode Hazard Claws -->
  <path d="M210,135 Q175,100 130,125 Q165,160 210,165 Z" fill="#ff5722" opacity="0.85"/>
  <path d="M290,135 Q325,100 370,125 Q335,160 290,165 Z" fill="#ff5722" opacity="0.85"/>
  <path d="M250,110 L270,155 L295,145 L265,180 L285,215 L250,195 L215,215 L235,180 L205,145 L230,155 Z" fill="#ffab91" filter="url(#glow)"/>

  <!-- Badges -->
  <rect x="25" y="24" width="168" height="26" rx="13" fill="#ff3d00" fill-opacity="0.2" stroke="#ff3d00" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#ff3d00"/>
  <text x="50" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="600" fill="#ff8a65">เควสดันเจียนรายสัปดาห์</text>

  <rect x="360" y="24" width="115" height="26" rx="6" fill="#240c06" stroke="#ff3d00" stroke-width="1"/>
  <text x="417" y="42" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#ff3d00" text-anchor="middle">🔥 ระดับยาก 3 รอบ</text>

  <!-- Title Banner -->
  <rect x="30" y="300" width="440" height="72" rx="10" fill="#140604" fill-opacity="0.92" stroke="#ff3d00" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="250" y="334" font-family="'Kanit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">คิเมรามอน (ระดับยาก)</text>
  <text x="250" y="358" font-family="'Kanit', sans-serif" font-size="13" font-weight="500" fill="#ffab91" text-anchor="middle">ลงครบ 3 รอบ จบเควสดันยากการันตี · 130 ฿</text>

  <rect x="8" y="8" width="484" height="384" rx="8" fill="none" stroke="#ff3d00" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>